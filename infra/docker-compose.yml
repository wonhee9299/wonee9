# wonee9 NAS 인프라 스택
#
# 비밀번호에 ${VAR:?...} 형태의 필수 검사를 쓰지 않는 이유: compose 는
# 프로필과 무관하게 파일 전체를 해석한다. 그렇게 두면 Tailscale 을 쓰지 않는
# 사람도 TS_AUTHKEY 를 채워야 'caddy 만 띄우기' 가 되어 프로필이 무의미해진다.
# 대신 './infra up' 이 요청된 프로필에 필요한 값만 확인한다.
#
# 기본으로는 Caddy(진입점) 하나만 뜬다. 나머지는 profile 로 필요할 때 켠다.
#   ./infra up                 → caddy 만
#   ./infra up data            → + postgres, redis
#   ./infra up monitor         → + uptime-kuma, dozzle
#   ./infra up full            → 전부

name: wonee9-infra

# 모든 서비스가 공유하는 기본값. 로그가 디스크를 채우지 않도록 상한을 둔다.
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  # 외부에서 들어오는 트래픽이 닿는 망. Caddy 와 웹 서비스만 여기 붙는다.
  edge:
    name: infra_edge
  # 데이터베이스 전용 망. internal: true 라 컨테이너 밖으로 나갈 수 없다.
  data:
    name: infra_data
    internal: true

services:
  # ── 진입점 ────────────────────────────────────────────────────────────
  # 바깥에 열리는 포트는 여기 하나뿐이다. 나머지 서비스는 포트를 열지 않고
  # Caddy 를 통해서만 접근한다.
  caddy:
    <<: *common
    image: caddy:2.8-alpine
    container_name: infra-caddy
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      BASE_DOMAIN: ${BASE_DOMAIN:-nas.local}
      SITE_SCHEME: ${SITE_SCHEME:-http}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - ${DOCKER_ROOT:-./data}/caddy/data:/data
      - ${DOCKER_ROOT:-./data}/caddy/config:/config
    networks:
      - edge
    healthcheck:
      # 전용 헬스 포트를 쓴다. 공개 사이트로 확인하면 Host 헤더가 맞지 않아
      # 설정이 깨져도 빈 200 이 돌아와 거짓 통과가 된다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2020/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 데이터 계층 (profile: data) ───────────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: infra-postgres
    profiles: ["data", "full"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # 한국어 정렬과 인코딩을 처음부터 맞춰 둔다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${DOCKER_ROOT:-./data}/postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: infra-redis
    profiles: ["data", "full"]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${DOCKER_ROOT:-./data}/redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 관측 계층 (profile: monitor) ──────────────────────────────────────
  # 서비스가 살아 있는지 감시하고 알림을 보낸다.
  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1
    container_name: infra-uptime-kuma
    profiles: ["monitor", "full"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${DOCKER_ROOT:-./data}/uptime-kuma:/app/data
    networks:
      - edge

  # 컨테이너 로그를 브라우저에서 본다. 도커 소켓은 읽기 전용으로만 붙인다.
  dozzle:
    <<: *common
    image: amir20/dozzle:v8
    container_name: infra-dozzle
    profiles: ["monitor", "full"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: "label=com.docker.compose.project=wonee9-infra"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  # ── 원격 접속 (profile: remote) ───────────────────────────────────────
  # 공유기 포트를 열지 않고 외부에서 NAS 에 접근한다.
  tailscale:
    <<: *common
    image: tailscale/tailscale:stable
    container_name: infra-tailscale
    profiles: ["remote", "full"]
    hostname: ${TS_HOSTNAME:-wonee9-nas}
    environment:
      TZ: ${TZ:-Asia/Seoul}
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - ${DOCKER_ROOT:-./data}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - edge
